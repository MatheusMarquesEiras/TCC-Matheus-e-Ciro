[project]
name = "tcc-matheus-e-ciro"
version = "0.1.0"
description = "Fine-tuning QLoRA do Qwen3.5-0.8B no MedPT para triagem médica em PT-BR"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "transformers>=4.51.0",
    "datasets>=3.0.0",
    "accelerate>=0.34.0",
    "peft>=0.13.0",
    "trl>=0.12.0",
    "bitsandbytes>=0.44.0",
    "scikit-learn>=1.5.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "anthropic>=0.40.0",
    "torch",
    "torchvision",
    "torchaudio",
    "flash-linear-attention>=0.5.0",
    "triton-windows<3.7",
    "causal-conv1d>=1.6.2.post1",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }

[tool.uv]
no-build-isolation-package = ["causal-conv1d"]

